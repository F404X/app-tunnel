name: Build and publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag from Directory.Build.props (for example v0.4.0)
        required: true
        type: string
      prerelease:
        description: Mark the release as a preview
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify release version and test source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [xml]$props = Get-Content -Raw Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$version") {
            throw "The tag must match v$version."
          }
          dotnet run --project tests/AppTunnel.Checks -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/proton-portal.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package AppTunnel for Windows x64
        shell: pwsh
        run: |
          .\Compilar.ps1 -Architecture win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Join-Path $env:RUNNER_TEMP AppTunnel
          Copy-Item dist/win-x64 $package -Recurse
          Copy-Item README.md, LEIA-ME.md, LICENSE $package
          Copy-Item Licenses $package -Recurse
          Copy-Item src/AppTunnel.Windows/Fonts/*-OFL.txt (Join-Path $package Licenses)
          $asset = Join-Path $env:RUNNER_TEMP AppTunnel-Windows-x64.zip
          Compress-Archive -Path $package -DestinationPath $asset -CompressionLevel Optimal
          Get-FileHash $asset -Algorithm SHA256

      - name: Publish GitHub release and ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $asset = Join-Path $env:RUNNER_TEMP AppTunnel-Windows-x64.zip
          $checksum = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = Join-Path $env:RUNNER_TEMP release-notes.md
          @"
          ## AppTunnel $env:RELEASE_TAG

          Baixe **AppTunnel-Windows-x64.zip** em **Assets**, extraia a pasta inteira e abra **AppTunnel.exe**. O [guia de instalação](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/README.md) explica as dependências e a configuração da rota.

          - VPN da Proton para aplicativos selecionados, incluindo Serein e Discord.
          - Conta Proton, importação de perfis WireGuard e controle pela bandeja.
          - Logo com fundo opaco. Os atalhos Serein only e Detect Discord ficam no fim da barra de Programas.

          SHA-256 do ZIP: $checksum
          "@ | Set-Content -Encoding utf8 $notes

          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, $asset,
            '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA,
            '--title', "AppTunnel $env:RELEASE_TAG", '--notes-file', $notes)
          if ($env:RELEASE_PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
