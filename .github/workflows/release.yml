name: Build and publish Windows release

# Every push to main builds and tests AppTunnel. What gets published depends on the head commit, or, when the head is
# a pull request merge commit, on the tip of the merged branch:
# - "Release AppTunnel vX.Y.Z" publishes a stable release (the Latest one on GitHub).
# - "Release AppTunnel vX.Y.Z-beta.N" publishes a beta (a prerelease).
# - Any other push that changes the app publishes a nightly, NightlyBaseVersion-nightly.YYYYMMDD.RUN (a prerelease).
# The version in the release subject must match Directory.Build.props.
# Each release title ends with its channel tag: [stable], [beta] or [nightly].
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'tests/**'
      - 'telemetry/**'
      - 'docs/telemetry-examples.txt'
      - 'docs/terms/**'
      - 'docs/release-notes.md'
      - 'installer/**'
      - 'Directory.Build.props'
      - 'Compilar.ps1'
  # A manual run plans the current head of main exactly as its push would have.
  workflow_dispatch:

permissions:
  contents: read

# Publishing runs one at a time so tags, the Latest badge and nightly cleanup never race.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # History and tags decide whether a push changed the app and what a nightly's notes list.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Plan the release and test the source
        id: plan
        shell: pwsh
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          [xml]$props = Get-Content -Raw Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          $base = $props.Project.PropertyGroup.NightlyBaseVersion
          if ($base -notmatch '^\d+\.\d+\.\d+$') { throw "NightlyBaseVersion must be x.y.z." }
          $subject = (git log -1 --format=%s HEAD).Trim()
          # A pull request merged with a merge commit publishes what its branch asked for: the subject of the
          # branch tip, so a release commit at the end of a merged branch still releases on its channel.
          $parents = @((git log -1 --format=%P HEAD).Trim() -split ' ')
          if ($parents.Count -gt 1 -and $subject -cmatch '^Merge pull request #\d+ ') {
            $subject = (git log -1 --format=%s HEAD^2).Trim()
            Write-Host "Merge commit; planning from the merged branch tip: $subject"
          }
          if ($subject -cmatch '^Release AppTunnel v(.+)$') {
            if ($Matches[1] -cne $version) { throw "The release subject asks for v$($Matches[1]) but Directory.Build.props has $version." }
            if ($version -cmatch '^\d+\.\d+\.\d+$') { $channel = 'stable' }
            elseif ($version -cmatch '^\d+\.\d+\.\d+-beta\.[1-9]\d*$') { $channel = 'beta' }
            else { throw "Release versions are x.y.z or x.y.z-beta.N, not $version." }
            $full = $version
          } elseif ($subject -cmatch '^Release AppTunnel') {
            throw "Malformed release subject: $subject"
          } else {
            if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:BEFORE -and $env:BEFORE -notmatch '^0+$') {
              git cat-file -e "$($env:BEFORE)^{commit}"
              if ($LASTEXITCODE -ne 0) { throw "Cannot compare with the previous head $($env:BEFORE)." }
              $files = git diff --name-only $env:BEFORE HEAD
            } else {
              $files = git diff --name-only HEAD~1 HEAD
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not list the changed files." }
            # Only changes to what ships in the app make a nightly; docs, tests and workflow edits just build and test.
            $app = @($files | Where-Object { $_ -match '^(src/|installer/|Directory\.Build\.props$|Compilar\.ps1$)' -and $_ -notmatch '\.md$' })
            if ($app.Count -eq 0) {
              $channel = 'none'
              $full = $version
            } else {
              $channel = 'nightly'
              # The commit's own UTC date keeps the version identical when a run is retried.
              $date = [DateTimeOffset]::FromUnixTimeSeconds([long](git log -1 --format=%ct HEAD)).UtcDateTime.ToString('yyyyMMdd')
              $full = "$base-nightly.$date.$($env:GITHUB_RUN_NUMBER)"
            }
          }
          $numeric = $full.Split('-')[0]
          "APPTUNNEL_VERSION=$full" >> $env:GITHUB_ENV
          "APPTUNNEL_NUMERIC_VERSION=$numeric" >> $env:GITHUB_ENV
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "tag=v$full" >> $env:GITHUB_OUTPUT
          Write-Host "Channel: $channel, version $full"
          dotnet run --project tests/AppTunnel.Checks -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/proton-portal.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/telemetry.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package AppTunnel for Windows x64
        shell: pwsh
        env:
          AppTunnelTelemetryEndpoint: ${{ vars.APPTUNNEL_TELEMETRY_ENDPOINT }}
        run: |
          .\Compilar.ps1 -Architecture win-x64 -SelfContained -Version $env:APPTUNNEL_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Join-Path $env:RUNNER_TEMP AppTunnel
          Copy-Item dist/win-x64 $package -Recurse
          $cultures = Get-ChildItem $package -Recurse -Filter '*.resources.dll' | ForEach-Object { $_.Directory.Name } | Sort-Object -Unique
          if ('pt-BR' -notin $cultures -or 'ru' -notin $cultures -or
              ($cultures | Where-Object { $_ -notin @('pt-BR', 'ru', 'ru-RU', 'en-US') })) {
            throw "Unexpected runtime languages: $cultures"
          }
          $product = (Get-Item (Join-Path $package AppTunnel.dll)).VersionInfo.ProductVersion
          if (!$product.StartsWith($env:APPTUNNEL_VERSION)) { throw "The app reports $product instead of $env:APPTUNNEL_VERSION." }
          $asset = Join-Path $env:RUNNER_TEMP AppTunnel-Windows-x64.zip
          Compress-Archive -Path $package -DestinationPath $asset -CompressionLevel Optimal
          Get-FileHash $asset -Algorithm SHA256

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $package = Join-Path $env:RUNNER_TEMP AppTunnel
          & $iscc "/DAppVersion=$env:APPTUNNEL_VERSION" "/DNumericVersion=$env:APPTUNNEL_NUMERIC_VERSION" "/DPackageDir=$package" "/O$env:RUNNER_TEMP" installer/AppTunnel.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test installer on Windows
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP AppTunnel-Setup-x64.exe
          $appDir = Join-Path $env:ProgramFiles AppTunnel
          $flags = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $installFlags = $flags + '/LANG=russian'
          $install = Start-Process $setup -ArgumentList $installFlags -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "AppTunnel setup failed ($($install.ExitCode))." }
          $record = (Get-ItemProperty HKLM:\SOFTWARE\AppTunnel\Installation).Path
          if ($record -ne $appDir) { throw "The installation path was not registered." }
          foreach ($name in @('AppTunnel.exe', 'AppTunnel.Proton.exe', 'coreclr.dll', 'unins000.exe')) {
            if (!(Test-Path (Join-Path $appDir $name))) { throw "Setup did not install $name." }
          }
          $consent = 'HKCU:\Software\F404X\AppTunnel\Telemetry'
          if (Test-Path $consent) { throw "Silent installation created telemetry consent." }
          New-Item $consent -Force | Out-Null
          New-ItemProperty $consent -Name Consent -Value 5 -PropertyType DWord -Force | Out-Null
          $settingsDir = Join-Path $env:LOCALAPPDATA AppTunnel
          New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null
          '{"Language":"ru"}' | Set-Content (Join-Path $settingsDir settings.json) -Encoding utf8
          $legacyLanguage = Join-Path $appDir de
          New-Item -ItemType Directory -Path $legacyLanguage -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $legacyLanguage System.Windows.Forms.resources.dll) -Force | Out-Null
          $app = Start-Process (Join-Path $appDir AppTunnel.exe) -ArgumentList '--startup' -PassThru
          if ($app.WaitForExit(2500)) { throw "AppTunnel did not stay open at startup ($($app.ExitCode))." }
          $upgrade = Start-Process $setup -ArgumentList $installFlags -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "AppTunnel upgrade failed ($($upgrade.ExitCode))." }
          if (!$app.WaitForExit(10000)) { throw "Setup did not close the running AppTunnel interface." }
          if (Test-Path $legacyLanguage) { throw "Setup did not remove obsolete language resources." }
          if ((Get-ItemProperty $consent).Consent -ne 5) { throw "Setup changed telemetry choices during upgrade." }
          $uninstallLog = Join-Path $env:RUNNER_TEMP AppTunnel-uninstall.log
          $remove = Start-Process (Join-Path $appDir unins000.exe) -ArgumentList ($flags + "/LOG=$uninstallLog") -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path (Join-Path $appDir AppTunnel.exe))) {
            if (Test-Path $uninstallLog) { Get-Content $uninstallLog -Tail 35 }
            throw "AppTunnel uninstall failed ($($remove.ExitCode))."
          }
          if (Test-Path $consent) { throw "AppTunnel uninstall left telemetry consent behind." }


      - name: Publish the release, installer and ZIP
        if: steps.plan.outputs.channel != 'none'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.plan.outputs.channel }}
        run: |
          $tag = $env:RELEASE_TAG
          # A retried run leaves a published release as it is, and finishes a draft an earlier attempt left behind.
          $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists -and $draft -eq 'false') { Write-Host "$tag is already published."; exit 0 }
          $asset = Join-Path $env:RUNNER_TEMP AppTunnel-Windows-x64.zip
          $setup = Join-Path $env:RUNNER_TEMP AppTunnel-Setup-x64.exe
          $zipChecksum = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupChecksum = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:RELEASE_CHANNEL -eq 'nightly') {
            $previous = git tag --merged HEAD~1 --sort=-creatordate --list 'v*' | Select-Object -First 1
            $range = if ($previous) { "$previous..HEAD" } else { "HEAD~20..HEAD" }
            $changes = (git log --no-merges --format='- %s' $range | Select-Object -First 40) -join "`n"
            $body = "Automatic nightly build of $($env:GITHUB_SHA.Substring(0, 7)). Nightly builds are experimental; choose the **Nightly** channel in **Settings → Updates** to receive them.`n`n### Changes`n`n$changes"
          } else {
            # Stable and beta notes come from docs/release-notes.md, edited in the release commit.
            $body = ((Get-Content -Raw docs/release-notes.md) -replace '(?s)<!--.*?-->', '').Trim()
          }
          $notes = Join-Path $env:RUNNER_TEMP release-notes.md
          @"
          ## AppTunnel $tag

          Download **AppTunnel-Setup-x64.exe** from **Assets** and run the installer. **AppTunnel-Windows-x64.zip** is the portable version. See the [installation guide](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/README.md) to set up Proton and your apps.

          $body

          Installer SHA-256: $setupChecksum

          ZIP SHA-256: $zipChecksum
          "@ | Set-Content -Encoding utf8 $notes

          # Created as a draft, checked, then published, so a half-uploaded release is never offered to updaters.
          if ($exists) {
            gh release upload $tag $setup $asset --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $setup $asset --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AppTunnel $tag [$($env:RELEASE_CHANNEL)]" --notes-file $notes --draft
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $names = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ('AppTunnel-Setup-x64.exe' -notin $names -or 'AppTunnel-Windows-x64.zip' -notin $names) { throw "The release assets did not upload." }
          if ($env:RELEASE_CHANNEL -eq 'stable') {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Every release title ends with its channel, [nightly], [beta] or [stable], so the list shows which is which.
      # This also labels releases published before the convention; 0.x releases without a suffix are left as they are.
      - name: Label every release with its channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 300 --json tagName,name | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($release in $releases) {
            $tag = $release.tagName
            if ($tag -cmatch '^v\d+\.\d+\.\d+-nightly\.\d{8}\.\d+$') { $channel = 'nightly' }
            elseif ($tag -cmatch '^v\d+\.\d+\.\d+-beta\.[1-9]\d*$') { $channel = 'beta' }
            elseif ($tag -cmatch '^v[1-9]\d*\.\d+\.\d+$') { $channel = 'stable' }
            else { continue }
            $title = "AppTunnel $tag [$channel]"
            if ($release.name -ceq $title) { continue }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title
            if ($LASTEXITCODE -ne 0) { Write-Warning "Could not label $tag." }
          }
          $global:LASTEXITCODE = 0

      - name: Keep the last 30 nightly builds
        if: steps.plan.outputs.channel == 'nightly'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 300 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Newest first by build date, then run number; stable, beta and older releases are never touched.
          $nightlies = @($releases | Where-Object { $_ -cmatch '^v\d+\.\d+\.\d+-nightly\.\d{8}\.\d+$' } |
            Sort-Object -Descending -Property { [long]($_ -replace '^.*-nightly\.(\d{8})\.\d+$', '$1') }, { [long]($_ -replace '^.*\.(\d+)$', '$1') })
          foreach ($old in $nightlies | Select-Object -Skip 30) {
            gh release delete $old --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { Write-Warning "Could not delete $old." }
          }
