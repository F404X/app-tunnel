name: Build and publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag from Directory.Build.props (for example v0.5.0)
        required: true
        type: string
      prerelease:
        description: Mark the release as a preview
        required: true
        default: true
        type: boolean

      publish:
        description: Publish GitHub release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify release version and test source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [xml]$props = Get-Content -Raw Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$version") {
            throw "The tag must match v$version."
          }
          dotnet run --project tests/AppTunnel.Checks -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/proton-portal.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package AppTunnel for Windows x64
        shell: pwsh
        run: |
          .\Compilar.ps1 -Architecture win-x64 -SelfContained
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Join-Path $env:RUNNER_TEMP AppTunnel
          Copy-Item dist/win-x64 $package -Recurse
          $cultures = Get-ChildItem $package -Recurse -Filter '*.resources.dll' | ForEach-Object { $_.Directory.Name } | Sort-Object -Unique
          if ('pt-BR' -notin $cultures -or 'ru' -notin $cultures -or
              ($cultures | Where-Object { $_ -notin @('pt-BR', 'ru', 'ru-RU', 'en-US') })) {
            throw "Unexpected runtime languages: $cultures"
          }
          Copy-Item README.md, LEIA-ME.md, LICENSE $package
          Copy-Item docs $package -Recurse
          Copy-Item Licenses $package -Recurse
          Copy-Item src/AppTunnel.Windows/Fonts/*-OFL.txt (Join-Path $package Licenses)
          $asset = Join-Path $env:RUNNER_TEMP AppTunnel-Windows-x64.zip
          Compress-Archive -Path $package -DestinationPath $asset -CompressionLevel Optimal
          Get-FileHash $asset -Algorithm SHA256

      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $package = Join-Path $env:RUNNER_TEMP AppTunnel
          & $iscc "/DAppVersion=$($env:RELEASE_TAG.Substring(1))" "/DPackageDir=$package" "/O$env:RUNNER_TEMP" installer/AppTunnel.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test installer on Windows
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP AppTunnel-Setup-x64.exe
          $appDir = Join-Path $env:ProgramFiles AppTunnel
          $flags = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $installFlags = $flags + '/LANG=russian'
          $install = Start-Process $setup -ArgumentList $installFlags -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "AppTunnel setup failed ($($install.ExitCode))." }
          $record = (Get-ItemProperty HKLM:\SOFTWARE\AppTunnel\Installation).Path
          if ($record -ne $appDir) { throw "The installation path was not registered." }
          foreach ($name in @('AppTunnel.exe', 'AppTunnel.Proton.exe', 'coreclr.dll', 'unins000.exe')) {
            if (!(Test-Path (Join-Path $appDir $name))) { throw "Setup did not install $name." }
          }
          $settingsDir = Join-Path $env:LOCALAPPDATA AppTunnel
          New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null
          '{"Language":"ru"}' | Set-Content (Join-Path $settingsDir settings.json) -Encoding utf8
          $legacyLanguage = Join-Path $appDir de
          New-Item -ItemType Directory -Path $legacyLanguage -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $legacyLanguage System.Windows.Forms.resources.dll) -Force | Out-Null
          $app = Start-Process (Join-Path $appDir AppTunnel.exe) -ArgumentList '--startup' -PassThru
          if ($app.WaitForExit(2500)) { throw "AppTunnel did not stay open at startup ($($app.ExitCode))." }
          $upgrade = Start-Process $setup -ArgumentList $installFlags -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "AppTunnel upgrade failed ($($upgrade.ExitCode))." }
          if (!$app.WaitForExit(10000)) { throw "Setup did not close the running AppTunnel interface." }
          if (Test-Path $legacyLanguage) { throw "Setup did not remove obsolete language resources." }
          $uninstallLog = Join-Path $env:RUNNER_TEMP AppTunnel-uninstall.log
          $remove = Start-Process (Join-Path $appDir unins000.exe) -ArgumentList ($flags + "/LOG=$uninstallLog") -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path (Join-Path $appDir AppTunnel.exe))) {
            if (Test-Path $uninstallLog) { Get-Content $uninstallLog -Tail 35 }
            throw "AppTunnel uninstall failed ($($remove.ExitCode))."
          }

      - name: Publish GitHub release, installer and ZIP
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $asset = Join-Path $env:RUNNER_TEMP AppTunnel-Windows-x64.zip
          $setup = Join-Path $env:RUNNER_TEMP AppTunnel-Setup-x64.exe
          $zipChecksum = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupChecksum = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = Join-Path $env:RUNNER_TEMP release-notes.md
          @"
          ## AppTunnel $env:RELEASE_TAG

          Baixe **AppTunnel-Setup-x64.exe** em **Assets** e siga o instalador. O **AppTunnel-Windows-x64.zip** é a versão portátil. Veja o [guia de instalação](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/README.md) para configurar a Proton e os aplicativos.

          - Iniciar com o Windows em Configurações e no menu da bandeja.
          - Instalador com .NET incluído e verificação de atualizações pelo AppTunnel.
          - Catálogo de aplicativos e interface em inglês, português e russo.
          - Modos WireGuard, WireGuard com preenchimento e AmneziaWG, com tentativa automática de rotas.
          - Opção de reiniciar Discord, PTB e Canary após aplicar a rota VPN.

          SHA-256 do instalador: $setupChecksum

          SHA-256 do ZIP: $zipChecksum
          "@ | Set-Content -Encoding utf8 $notes

          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, $setup, $asset,
            '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA,
            '--title', "AppTunnel $env:RELEASE_TAG", '--notes-file', $notes)
          if ($env:RELEASE_PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
