name = "app-tunnel-telemetry"
main = "index.mjs"
compatibility_date = "2026-01-01"
workers_dev = true
preview_urls = false

[observability]
enabled = false

[triggers]
crons = ["19 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "app-tunnel-telemetry"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[ratelimits]]
name = "INGEST_LIMITER"
namespace_id = "61001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "61002"
simple = { limit = 20, period = 60 }

[vars]
ACCESS_ISSUER = ""
ACCESS_AUD = ""
DASHBOARD_ORIGIN = ""
